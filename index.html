a5d6-0dba8a1bda96", "text": "无论是复制口令还是扫一扫还是碰一碰用户接收的展示的弹窗变现都是一致的，弹窗的布局有没有参考的公控和规范再优化下，文案你在调整下"}, {"who": "陈宇泽", "at": "2026-10-22T06:42:10Z", "issue": "INN-2163", "url": "https://multica.transsion-os.com/issues/01a15dca-52a6-7442-a5d6-0dba8a1bda96", "text": "接收者分享的面板，增加个资源的缩略图，面板的标题不区分分享路径，内容都是一致的"}, {"who": "陈宇泽", "at": "2026-10-22T06:10:55Z", "issue": "INN-2163", "url": "https://multica.transsion-os.com/issues/01a15dca-52a6-7442-a5d6-0dba8a1bda96", "text": "交互说明再精简下 现在输出的内容太多，可读性也比较差"}, {"who": "陈宇泽", "at": "2026-10-22T02:42:22Z", "issue": "INN-2163", "url": "https://multica.transsion-os.com/issues/01a15dca-52a6-7442-a5d6-0dba8a1bda96", "text": "toast提醒你循序下公控规范， 先不用更新Demo"}, {"who": "陈宇泽", "at": "2026-10-22T02:29:55Z", "issue": "INN-2163", "url": "https://multica.transsion-os.com/issues/01a15dca-52a6-7442-a5d6-0dba8a1bda96", "text": "分析面板下半部分留白过多，空了一大部分，面板高度贴合内容区，做自适应"}, {"who": "陈宇泽", "at": "2026-10-22T02:13:47Z", "issue": "INN-2163", "url": "https://multica.transsion-os.com/issues/01a15dca-52a6-7442-a5d6-0dba8a1bda96", "text": "分享面板是没有取消的，对齐系统分享面板，我已经给你截图了，分享保存的图片样式 图片内容占4/5的位置 图片上展示资源的名称 底部区域展示主题的LOGO、主题商城 请在设备上使用系统浏览器扫码查看 这个你没调整啊"}, {"who": "陈宇泽", "at": "2026-10-22T02:04:39Z", "issue": "INN-2169", "url": "https://multica.transsion-os.com/issues/01a15e4d-ab50-7833-84bd-8bbc4a72b81c", "text": "分享面板是没有取消的，对齐系统分享面板，我已经给你截图了，分享保存的图片样式 图片内容占4/5的位置 图片上展示资源的名称 底部区域展示主题的LOGO、主题商城 请在设备上使用系统浏览器扫码查看"}, {"who": "陈宇泽", "at": "2026-10-21T11:45:33Z", "issue": "INN-2163", "url": "https://multica.transsion-os.com/issues/01a15dca-52a6-7442-a5d6-0dba8a1bda96", "text": "img_v3_0216m_fc888662-d333-480a-a7a7-bd89d786f6eg.jpg 这个系统分享面板 可以照着做吧 标题：为正在分享主题（主题是根据分享的资源替换的）下面资源的名称、资源缩略图，口令，下面有两个按钮 复制、保存图片 ，下面就是系统中的极速互传，目前不接入其他的三方应用分型"}, {"who": "陈宇泽", "at": "2026-10-21T11:01:45Z", "issue": "INN-2163", "url": "https://multica.transsion-os.com/issues/01a15dca-52a6-7442-a5d6-0dba8a1bda96", "text": "分享的面板能复用系统的面板不"}, {"who": "陈宇泽", "at": "2026-10-21T09:39:24Z", "issue": "INN-2163", "url": "https://multica.transsion-os.com/issues/01a15dca-52a6-7442-a5d6-0dba8a1bda96", "text": "能不能不管问题 直接输出啊"}, {"who": "陈宇泽", "at": "2026-10-21T09:25:54Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "安排Figma介入"}, {"who": "陈宇泽", "at": "2026-10-21T09:14:11Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "都OK"}, {"who": "陈宇泽", "at": "2026-10-21T09:10:39Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "OK"}, {"who": "陈宇泽", "at": "2026-10-21T08:49:10Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "OK"}, {"who": "陈宇泽", "at": "2026-10-21T08:34:31Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "可以 分享成功后 接收方统一打开的资源详情页 有权益可以直接应用，无权益的也是跳转到详情页底部按钮时购买就好了 还需要补一个分享成功后 在我的下载中查看"}, {"who": "陈宇泽", "at": "2026-10-21T08:16:48Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "这个线框稿按照当前的路径和流程串成一页吗 这样我更好理解"}, {"who": "陈宇泽", "at": "2026-10-21T07:46:41Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "普通用户接收啥意思 我的需求应该不包含吧 分享面板拉的系统的分享面板 面板中会显示分享资源的名称 缩略图 口令 指支持复制口令分享，保存图片分享，碰一碰分享这个事系统分享的面板 你可以参考下 img_v3_0216m_fc888662-d333-480a-a7a7-bd89d786f6eg.jpg"}, {"who": "陈宇泽", "at": "2026-10-21T07:20:51Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "Q-001-a：用户打开自带扫一扫的能力 Q-004-b：按照建议 Q-007-b：建议提供复制口令补发"}, {"who": "陈宇泽", "at": "2026-10-21T07:03:15Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "Q-001：复制口令是指只要当前复制了口令，打开/返回主题商城，检测到有口令，就弹出弹窗，多个口令提示保留一个后重试，不把口令写入搜索历史；失败/返回保留输入便于修改。扫一扫支持相机，自带浏览器扫一扫的能力 Q-002：建议无权益接收者接受后先完成购买，再成功接收并落盘进入预览；已有权益直接接收后预览应用。 Q-003：不自动跳转 Q-004：分享作品和发布状态无关 Q-005：不支持机型隐藏目标； Q-006：按建议 Q-007：准备"}, {"who": "程茗", "at": "2026-10-21T06:14:18Z", "issue": "INN-2110", "url": "https://multica.transsion-os.com/issues/01a1599e-f2d2-72ae-8fa2-268e49bbbf09", "text": "@产品小队队长 为什么会出现输出乱码的现象 image.png"}]}, {"id": "01a15825-eea5-7a14-8ce5-398d2aa24e1b", "ident": "INN-2079", "url": "https://multica.transsion-os.com/issues/01a15825-eea5-7a14-8ce5-398d2aa24e1b", "business": "主题", "name": "我的模块整合", "status": "Demo 已交付，待确认", "dev_status": "", "blocked": ["INN-2093"], "deliverables": {"UX": {"ident": "INN-2080", "url": "https://multica.transsion-os.com/issues/01a15826-292a-7e9d-b981-cd852b8f6d4e", "done_at": "2026-10-20T08:43:03Z"}, "AI PRD": {"ident": "INN-2079", "url": "https://multica.transsion-os.com/issues/01a15825-eea5-7a14-8ce5-398d2aa24e1b", "done_at": null}}, "figma": {"url": "https://www.figma.com/design/CWgJgs2rwyhQOeWXOKrmlB/Mine?node-id=63-5838", "file": "CWgJgs2rwyhQOeWXOKrmlB", "from": "INN-2141"}, "figma_note": null, "demo": {"url": "https://multica.transsion-os.com/api/attachments/01a15db2-216e-7396-bf8f-de1a30bfd474/download", "issue": "INN-2160", "file": "mine-demo.html", "at": "2026-10-21T09:01:57Z"}, "created_at": "2026-10-20T07:10:43Z", "last_activity": "2026-10-21T09:05:20Z", "marks": {"Demo": "updated"}, "is_new": false, "prev_status": "设计稿已交付，待确认", "new_subs": [{"ident": "INN-2158", "url": "https://multica.transsion-os.com/issues/01a15d9e-eb1d-77ab-bb19-49c3e8328f5b", "title": "主题 · 我的模块整合（Demo·同步创作者主页布局）", "status": "in_review", "type": "Demo"}, {"ident": "INN-2160", "url": "https://multica.transsion-os.com/issues/01a15da8-84d4-7865-bd9d-c8690975c50e", "title": "主题 · 我的模块整合（Demo·同步创作者主页五项布局）", "status": "in_review", "type": "Demo"}], "human": [{"who": "陈宇泽", "at": "2026-10-21T08:57:07Z", "issue": "INN-2141", "url": "https://multica.transsion-os.com/issues/01a15c50-2677-76e4-a124-20607119cbeb", "text": "image.png 你恢复到你上一个版本 -8602-9857809d0bb2", "text": "还有就是除了pd里面描述的场景，还有一种长按选中笔记点击下方锁的icon，也需要体现在稿子里，没有设置密码需要走设置密码流程才能加密笔记"}, {"who": "聂贝函冰", "at": "2026-10-23T08:00:33Z", "issue": "INN-2265", "url": "https://multica.transsion-os.com/issues/01a16755-fffd-7e47-8602-9857809d0bb2", "text": "【设置密码流程】输入密码、二次验证密码【密保输入流程】验证密码，你都需要有错误提示呀，不能只画个流程图指向呀"}, {"who": "聂贝函冰", "at": "2026-10-23T07:51:48Z", "issue": "INN-2265", "url": "https://multica.transsion-os.com/issues/01a16755-fffd-7e47-8602-9857809d0bb2", "text": "A1创建入口，是点击进入加密笔记，加密笔记需要显示一个提示去设置密码的空态页，还有所有输入密码页面、二次确认密码页面都要有确定按钮"}, {"who": "聂贝函冰", "at": "2026-10-23T07:39:08Z", "issue": "INN-2265", "url": "https://multica.transsion-os.com/issues/01a16755-fffd-7e47-8602-9857809d0bb2", "text": "Q001这个属于其他业务，登录就登录上了。与产品确认，如果账号登录上之后推出密码设置流程+下次还想设置密码，可以跳过强制账号登录的步骤。 Q003 1.修改密码入口在记事本设置里面2.不用，这个属于是点击忘记密码，他不记得密码了，直接走到密保问题/账号密码验证阶段就可以，验证成功后，可以直接设置新密码。注意新密码不查重，是可以跟之前的密码一样的3.返回页面问题。验证密保问题和验证账号密码都是模态面板的形式出现在点击忘记密码之后的【身份验"}, {"who": "聂贝函冰", "at": "2026-10-23T07:07:59Z", "issue": "INN-2265", "url": "https://multica.transsion-os.com/issues/01a16755-fffd-7e47-8602-9857809d0bb2", "text": "Q001:账号绑定是流程中的最后一个步骤，属于其他业务的，我一会儿确定了跟你讲 Q002:设置密码是用于解锁加密笔记文件夹的。设置密保&amp;绑定账号是为了忘记密码和修改密码进行的二次验证。注意，密保和账号首次设置加密笔记密码的时候是强制要求设置的，之后忘记密码/修改密码密保和账号验证是二选一的关系。 Q003:的问题我没看懂，你再解释一下 注意一下忘记密码的入口，是在解锁加密笔记文件夹的一个文字按钮，不是单独的忘记密码的页面 Q00"}, {"who": "聂贝函冰", "at": "2026-10-23T05:55:37Z", "issue": "INN-2264", "url": "https://multica.transsion-os.com/issues/01a16752-fa70-7898-80fd-fbda45e1e628", "text": "@产品小队队长"}]}, {"id": "01a1680e-102e-7964-a04e-a9fdd1eeb1b6", "ident": "INN-2272", "url": "https://multica.transsion-os.com/issues/01a1680e-102e-7964-a04e-a9fdd1eeb1b6", "business": "文管", "name": "压缩功能（AI PRD 对齐视觉稿）", "status": "AI PRD 已交付，待确认", "dev_status": "", "blocked": [], "deliverables": {"PRD": {"ident": "INN-2274", "url": "https://multica.transsion-os.com/issues/01a16814-3514-7712-9670-52e899c65c85", "done_at": null}, "AI PRD": {"ident": "INN-2273", "url": "https://multica.transsion-os.com/issues/ const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const fmtDay = s => { const d = new Date(s); return `${d.getMonth()+1}月${d.getDate()}日 周${"日一二三四五六"[d.getDay()]} ${String(d.getHours()).padStart(2,"0")}:00`; };
const a = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`;
const stCls = s => /输出中|进行中|阻塞|待办/.test(s) ? "doing" : /待确认|待评审/.test(s) ? "review" : /完成/.test(s) ? "done" : "";
const MARK = {new: `<span class="m-new">（本周新增）</span>`, updated: `<span class="m-upd">（本周更新）</span>`};
const ST_CN = {todo:"待办", backlog:"待规划", in_progress:"进行中", in_review:"待评审", blocked:"阻塞", done:"已完成", cancelled:"已取消"};

$("#title").textContent = D.title;
$("#meta").textContent = `数据更新于 ${fmt(D.generated_at)} · 共 ${D.rows.length} 个需求 · 数据来源 Multica`;
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["all","weekly"].forEach(id => $("#"+id).classList.toggle("hidden", id !== t.dataset.tab));
});

function deliverables(r) {
  const m = k => (r.marks && MARK[r.marks[k]]) || "";
  const d = r.deliverables, L = [];
  for (const k of ["PRD", "AI PRD", "UX"])
    if (d[k]) L.push(`<div><span class="k">${k}：</span>${a(d[k].url, d[k].ident)}${m(k)}</div>`);
  if (r.figma) L.push(`<div><span class="k">Figma 静态稿：</span>${a(r.figma.url, "设计稿")}${m("Figma")}</div>`);
  else if (r.figma_note) L.push(`<div><span class="k">Figma 静态稿：</span>${esc(r.figma_note)}</div>`);
  if (r.demo) L.push(`<div><span class="k">Demo：</span>${a(r.demo.url, r.demo.issue + "-Demo")}${m("Demo")}</div>`);
  return L.join("") || `<span class="sub">暂无</span>`;
}

function weekDetail(r) {
  if (!r.new_subs) return "";
  const parts = [];
  if (r.new_subs.length) parts.push(`<details><summary>本周新建子任务 ${r.new_subs.length} 个</summary><ul>${r.new_subs.map(s =>
    `<li>${a(s.url, s.ident)} ${esc(s.title.replace(/^[^·]*·\s*/, ""))} · 现在${ST_CN[s.status] || s.status}</li>`).join("")}</ul></details>`);
  if (r.human.length) parts.push(`<details><summary>本周成员意见 ${r.human.length} 条</summary><ul>${r.human.map(h =>
    `<li><b>${esc(h.who)}</b> ${fmt(h.at)} · ${a(h.url, h.issue)}<br>${esc(h.text) || "（附件/图片）"}</li>`).join("")}</ul></details>`);
  return parts.join("");
}

function renderRows(rows, tbody, emptyText) {
  const span = {}; rows.forEach(r => span[r.business] = (span[r.business] || 0) + 1);
  const seen = new Set();
  tbody.innerHTML = rows.map(r => {
    const biz = seen.has(r.business) ? "" : `<td class="biz" rowspan="${span[r.business]}">${esc(r.business)}</td>`;
    seen.add(r.business);
    const blk = r.blocked.length ? `<div class="sub blk">阻塞子任务 ${r.blocked.length} 个：${r.blocked.join("、")}</div>` : "";
    const dev = r.dev_status ? `<div class="dev">研发：${esc(r.dev_status)}</div>` : "";
    const prev = r.prev_status ? `<div class="sub">本周变化，原：${esc(r.prev_status)}</div>` : "";
    const isNew = r.is_new ? `<span class="tag-new">本周新需求</span>` : "";
    const sub = r.new_subs ? weekDetail(r) : `<div class="sub">最近活动 ${fmt(r.last_activity)}</div>`;
    return `<tr>${biz}<td>${esc(r.name)}${isNew}${sub}</td>
      <td><span class="st ${stCls(r.status)}">${esc(r.status)}</span>${prev}${dev}${blk}</td>
      <td>${a(r.url, r.ident)}</td><td class="dl">${deliverables(r)}</td></tr>`;
  }).join("") || `<tr><td colspan="5" class="empty">${emptyText}</td></tr>`;
}

// ---------- 总表 ----------
const bizs = D.business_order.filter(b => D.rows.some(r => r.business === b));
let bizOn = new Set(bizs), q = "";
$("#bizbar").innerHTML = bizs.map(b => `<span class="chip on" data-b="${esc(b)}">${esc(b)}</span>`).join("") +
  `<input type="search" id="tq" placeholder="搜索需求 / 编号">`;
document.querySelectorAll("#bizbar .chip").forEach(c => c.onclick = () => {
  bizOn.has(c.dataset.b) ? bizOn.delete(c.dataset.b) : bizOn.add(c.dataset.b);
  c.classList.toggle("on"); renderAll();
});
$("#tq").oninput = e => { q = e.target.value.trim().toLowerCase(); renderAll(); };
const match = (r, s) => !s || (r.name + r.ident + r.business + r.status).toLowerCase().includes(s);
function renderAll() { renderRows(D.rows.filter(r => bizOn.has(r.business) && match(r, q)), $("#tbody"), "没有匹配的需求"); }
renderAll();

// ---------- 每周变化 ----------
$("#weeksel").innerHTML = D.weeks.map((w, i) =>
  `<option value="${i}">${fmtDay(w.start)} → ${fmtDay(w.end)}${w.ongoing ? "（本周，进行中）" : ""}</option>`).join("");
let wq = "";
$("#weeksel").onchange = renderWeek;
$("#wq").oninput = e => { wq = e.target.value.trim().toLowerCase(); renderWeek(); };
function renderWeek() {
  const w = D.weeks[+$("#weeksel").value];
  const rows = w.rows.filter(r => match(r, wq));
  const nNew = w.rows.reduce((s, r) => s + Object.values(r.marks).filter(v => v === "new").length, 0);
  $("#wnote").innerHTML = `${w.ongoing ? `本周期尚未结束，统计截至 ${fmt(D.generated_at)}。` : ""}` +
    `本周有变化的需求 ${w.rows.length} 个，新需求 ${w.rows.filter(r => r.is_new).length} 个，新增交付物 ${nNew} 项。` +
    `只展示有变化的需求：新需求、状态变化、交付物新增或更新、新建子任务。`;
  renderRows(rows, $("#wbody"), "这一周没有变化");
}
renderWeek();
</script>
</body>
</html>
