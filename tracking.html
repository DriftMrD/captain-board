const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const fmtDay = s => { const d = new Date(s); return `${d.getMonth()+1}月${d.getDate()}日 周${"日一二三四五六"[d.getDay()]} ${String(d.getHours()).padStart(2,"0")}:00`; };
const a = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`;
const stCls = s => s === "已交付" ? "done" : /中$/.test(s) ? "doing" : "";
const fmtD = s => { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const MARK = {new: `<span class="m-new">本周新增</span>`, updated: `<span class="m-upd">本周更新</span>`};
const ST_CN = {todo:"待办", backlog:"待规划", in_progress:"进行中", in_review:"待评审", blocked:"阻塞", done:"已完成", cancelled:"已取消"};

$("#title").textContent = D.title;
$("#meta").innerHTML = `数据更新于 ${fmt(D.generated_at)} · 共 ${D.rows.length} 个需求 · 数据来源 Multica · <a href="./">产品队长看板 →</a>`;
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["all","weekly"].forEach(id => $("#"+id).classList.toggle("hidden", id !== t.dataset.tab));
});

// Stage order: 埋点设计 → 埋点开发 → 用例生成 → 埋点测试; items come pre-built from build_tracking.py.
const items = r => r.items || [];
// Agent working time (sum of run durations), not wall-clock.
const dur = sec => !sec ? "" : sec < 3600 ? `${Math.max(1, Math.round(sec / 60))}分钟`
  : `${Math.floor(sec / 3600)}小时${Math.round(sec % 3600 / 60) ? Math.round(sec % 3600 / 60) + "分" : ""}`;
const spentOf = (r, it) => (r.spent || {})[it.t];
// Stage time and weekly mark are shown once, on the first deliverable of each stage.
function deliverables(r) {
  const m = t => (r.marks && MARK[r.marks[t]]) || "";
  const seen = new Set();
  const lines = items(r).map(it => {
    const first = !seen.has(it.t); seen.add(it.t);
    return `<div><span class="k">${it.k}：</span>${it.url ? a(it.url, it.label) : esc(it.label)}${
      first && spentOf(r, it) ? `<span class="dur">${dur(spentOf(r, it))}</span>` : ""}${first ? m(it.t) : ""}</div>`;
  }).join("");
  const total = r.spent_total ? `<div class="tot">需求总输出时间：${dur(r.spent_total)}</div>` : "";
  return (lines || `<span class="sub">暂无</span>`) + total;
}
const testText = r => r.stats ? `${r.stats.total} 条：PASS ${r.stats.pass} / FAIL ${r.stats.fail}` : "";
function testCell(r) { return r.stats ? esc(testText(r)) : ""; }

function weekDetail(r) {
  if (!r.new_subs) return "";
  const parts = [];
  if (r.new_subs.length) parts.push(`<details><summary>本周新建子任务 ${r.new_subs.length} 个</summary><div class="pop"><ul>${r.new_subs.map(s =>
    `<li>${a(s.url, s.ident)} ${esc(s.title.replace(/^[^·]*·\s*/, ""))} · 现在${ST_CN[s.status] || s.status}</li>`).join("")}</ul></div></details>`);
  if (r.human.length) parts.push(`<details><summary>本周成员意见 ${r.human.length} 条</summary><div class="pop"><ul>${r.human.map(h =>
    `<li><b>${esc(h.who)}</b> ${fmt(h.at)} · ${a(h.url, h.issue)}<br>${esc(h.text) || "（附件/图片）"}</li>`).join("")}</ul></div></details>`);
  return parts.join("");
}

function renderRows(rows, tbody, emptyText, week) {
  const span = {}; rows.forEach(r => span[r.business] = (span[r.business] || 0) + 1);
  const seen = new Set();
  tbody.innerHTML = rows.map(r => {
    const biz = seen.has(r.business) ? "" : `<td class="biz" rowspan="${span[r.business]}">${esc(r.business)}</td>`;
    seen.add(r.business);
    const prev = r.prev_status ? `<div class="sub">本周变化，原：${esc(r.prev_status)}</div>` : "";
    const isNew = r.is_new ? `<span class="tag-new">本周新需求</span>` : "";
    const sub = r.new_subs ? weekDetail(r) : `<div class="sub">最近活动 ${fmt(r.last_activity)}</div>`;
    return `<tr>${biz}<td>${esc(r.name)}${isNew}${sub}</td>
      <td><span class="st ${stCls(r.status)}">${esc(r.status)}</span>${prev}</td>
      <td>${a(r.url, r.ident)}</td><td class="${r.squad ? "" : "sub"}">${r.squad ? "是" : "否"}</td><td class="dl">${deliverables(r)}</td>
      <td>${testCell(r)}</td></tr>`;
  }).join("") || `<tr><td colspan="7" class="empty">${emptyText}</td></tr>`;
}

// ---------- 总表 ----------
const bizs = D.business_order.filter(b => D.rows.some(r => r.business === b));
let bizOn = new Set(bizs), q = "";

$("#tq").oninput = e => { q = e.target.value.trim().toLowerCase(); renderAll(); };
const match = (r, s) => !s || (r.name + r.ident + r.business + r.status).toLowerCase().includes(s);
const STATUSES = D.statuses;
// Excel-style filter in the 状态 header; keeps the dropdown open across re-renders.
// Excel-style header filter; groups = [{name, opts: [{key, label, n}]}]. Keeps the dropdown open across re-renders.
function headerFilter(th, title, groups, allKeys, onSet, rerender) {
  const wasOpen = th.querySelector("details")?.open;
  const partial = onSet.size !== allKeys.length;
  const opt = o => `<label><input type="checkbox" data-k="${esc(o.key)}"${onSet.has(o.key) ? " checked" : ""}> ${esc(o.label)} <span class="n">${o.n}</span></label>`;
  th.innerHTML = `<details class="hf"${wasOpen ? " open" : ""}><summary title="${partial ? "已筛选" : "筛选"}">${title}<span class="fi${partial ? " on" : ""}">▾</span></summary>
    <div class="pop fpop"><label><input type="checkbox" data-all${partial ? "" : " checked"}> 全选</label>${
    groups.map(g => (g.name ? `<div class="grp">${g.name}</div>` : "") + g.opts.map(opt).join("")).join("")}</div></details>`;
  th.querySelectorAll("input").forEach(cb => cb.onchange = () => {
    if (cb.dataset.k === undefined) { onSet.clear(); if (cb.checked) allKeys.forEach(x => onSet.add(x)); }
    else cb.checked ? onSet.add(cb.dataset.k) : onSet.delete(cb.dataset.k);
    rerender();
  });
}
function statusFilter(th, rows, onSet, rerender) {
  headerFilter(th, "状态", [{opts: STATUSES.map(st => ({key: st, label: st, n: rows.filter(r => r.status === st).length}))}],
    STATUSES, onSet, rerender);
}
const SQ = ["是", "否"];
const sqKey = r => r.squad ? "是" : "否";
function squadFilter(th, rows, onSet, rerender) {
  headerFilter(th, "经队长", [{opts: SQ.map(v => ({key: v, label: v, n: rows.filter(r => sqKey(r) === v).length}))}],
    SQ, onSet, rerender);
}
function bizFilter(th, rows, onSet, rerender) {
  headerFilter(th, "业务", [{opts: bizs.map(b => ({key: b, label: b, n: rows.filter(r => r.business === b).length}))}],
    bizs, onSet, rerender);
}
const stOn = new Set(STATUSES), sqOn = new Set(SQ);
const isDone = r => r.status === "已交付";
const visibleRows = () => D.rows.filter(r => bizOn.has(r.business) && stOn.has(r.status) && sqOn.has(sqKey(r)) && match(r, q) &&
  !($("#hideDone").checked && isDone(r)));
function renderAll() {
  const rows = visibleRows();
  const nb = new Set(D.rows.map(r => r.business)).size, vb = new Set(rows.map(r => r.business)).size;
  $("#summary").innerHTML = `共 ${nb} 个业务、${D.rows.length} 个需求` +
    `，其中经队长调度 ${D.rows.filter(r => r.squad).length} 个、已交付 ${D.rows.filter(isDone).length} 个` +
    (rows.length !== D.rows.length ? `；当前筛选显示 ${vb} 个业务、${rows.length} 个需求` : "");
  statusFilter($("#th-st"), D.rows, stOn, renderAll);
  bizFilter($("#th-biz"), D.rows, bizOn, renderAll);
  squadFilter($("#th-sq"), D.rows, sqOn, renderAll);
  renderRows(rows, $("#tbody"), "没有匹配的需求");
}

  const seen = new Set();
  const body = rows.map(r => {
    const biz = seen.has(r.business) ? "" : `<td ${td} rowspan="${span[r.business]}">${esc(r.business)}</td>`;
    seen.add(r.business);
    const dl = items(r).map(it => `${it.k}：${it.url ? `<a href="${esc(it.url)}">${esc(it.label)}</a>` : esc(it.label)}${
      spentOf(r, it) ? `（${dur(spentOf(r, it))}）` : ""}`).join("<br>") + (r.spent_total ? `<br>需求总输出时间：${dur(r.spent_total)}` : "");
    const fb = esc(testText(r));
    const st = esc(r.status);
    return `<tr>${biz}<td ${td}>${esc(r.name)}</td><td ${td}>${st}</td><td ${td}><a href="${esc(r.url)}">${r.ident}</a></td><td ${td}>${r.squad ? "是" : "否"}</td><td ${td}>${dl}</td><td ${td}>${fb}</td></tr>`;
  }).join("");
  const COLS = ["业务", "需求", "状态", "Multica 地址", "经队长", "交付物", "测试结果"];
  const head = COLS.map(h => `<th ${td}>${h}</th>`).join("");
  const htmlStr = `<table style="border-collapse:collapse"><tr>${head}</tr>${body}</table>`;
  const text = [COLS.join("\t")].concat(rows.map(r =>
    [r.business, r.name, r.status, `${r.ident} ${r.url}`, r.squad ? "是" : "否",
     items(r).map(it => `${it.k}：${it.label}${it.url ? " " + it.url : ""}${spentOf(r, it) ? `（${dur(spentOf(r, it))}）` : ""}`).join(" ／ ") +
       (r.spent_total ? ` ／ 需求总输出时间：${dur(r.spent_total)}` : ""),
     testText(r)].join("\t"))).join("\n");
  const done = () => toast(`已复制 ${rows.length} 行，可直接粘贴到飞书文档`);
  if (navigator.clipboard && window.ClipboardItem) {
    navigator.clipboard.write([new ClipboardItem({
      "text/html": new Blob([htmlStr], {type: "text/html"}), "text/plain": new Blob([text], {type: "text/plain"})})])
      .then(done, () => legacyCopy(htmlStr) && done());
  } else if (legacyCopy(htmlStr)) done();
}
function legacyCopy(htmlStr) {
  const box = document.createElement("div");
  box.innerHTML = htmlStr; box.style.cssText = "position:fixed;left:-9999px;top:0";
  document.body.appendChild(box);
  const range = document.createRange(); range.selectNode(box);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  const ok = document.execCommand("copy"); sel.removeAllRanges(); box.remove();
  return ok;
}
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1800);
}
$("#copyAll").onclick = () => copyTable(visibleRows());

// Only one popover open at a time; clicking elsewhere closes it.
document.addEventListener("click", e => {
  document.querySelectorAll("details[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; });
});

// ---------- 每周变化 ----------
// Custom dropdown: the native <select> menu on macOS covers the ‹ › buttons.
const weekLabel = w => `${fmtDay(w.start)} → ${fmtDay(w.end)}${w.ongoing ? "（本周，进行中）" : ""}`;
let wi = 0, wq = "";
$("#wopts").onclick = e => {
  const o = e.target.closest("[data-i]");
  if (!o) return;
  wi = +o.dataset.i; $("#weeksel").open = false; renderWeek();
};
$("#wq").oninput = e => { wq = e.target.value.trim().toLowerCase(); renderWeek(); };
// weeks are newest-first: "previous week" means a larger index
function stepWeek(d) {
  const i = wi + d;
  if (i < 0 || i >= D.weeks.length) return;
  wi = i; renderWeek();
}
$("#wprev").onclick = () => stepWeek(1);
$("#wnext").onclick = () => stepWeek(-1);
document.addEventListener("keydown", e => {
  if ($("#weekly").classList.contains("hidden") || /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") stepWeek(1);
  if (e.key === "ArrowRight") stepWeek(-1);
});
let tx = null, ty = null;
$("#weekly").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
$("#weekly").addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) stepWeek(dx > 0 ? 1 : -1);
  tx = null;
});

const wstOn = new Set(STATUSES), wbizOn = new Set(bizs), wsqOn = new Set(SQ);
function renderWeek() {
  const i = wi;
  $("#wsum").textContent = weekLabel(D.weeks[i]);
  $("#wopts").innerHTML = D.weeks.map((w, k) => `<div class="wopt${k === i ? " on" : ""}" data-i="${k}">${esc(weekLabel(w))}</div>`).join("");
  $("#wprev").disabled = i >= D.weeks.length - 1;
  $("#wnext").disabled = i <= 0;
  const w = D.weeks[i];
  statusFilter($("#wth-st"), w.rows, wstOn, renderWeek);
  bizFilter($("#wth-biz"), w.rows, wbizOn, renderWeek);
  squadFilter($("#wth-sq"), w.rows, wsqOn, renderWeek);
  const rows = w.rows.filter(r => wbizOn.has(r.business) && wstOn.has(r.status) && wsqOn.has(sqKey(r)) && match(r, wq));
  const nNew = w.rows.reduce((s, r) => s + Object.values(r.marks).filter(v => v === "new").length, 0);
  $("#wnote").innerHTML = `${w.ongoing ? `本周期尚未结束，统计截至 ${fmt(D.generated_at)}。` : ""}` +
    `本周有变化的需求 ${w.rows.length} 个，新需求 ${w.rows.filter(r => r.is_new).length} 个，新增交付物 ${nNew} 项。` +
    `只展示有变化的需求：新需求、状态变化、交付物新增或更新、本周有执行记录或成员意见。`;
  renderRows(rows, $("#wbody"), "这一周没有变化",
    {startUtc: new Date(w.start).toISOString().slice(0, 19) + "Z", endUtc: new Date(w.end).toISOString().slice(0, 19) + "Z"});
}
renderWeek();

</script>
</body>
